# Geplante Live-Tests gegen data.finance.admin.ch (DRIFT-005).
#
# Die Unit-Tests laufen gegen aufgezeichnete bzw. gemockte Antworten und
# koennen deshalb nicht bemerken, wenn die Quelle ihr Format aendert. Die
# `-m live`-Tests fragen sie wirklich ab; die CI der Pull Requests schliesst
# sie per `-m "not live"` aus, und das bleibt so.
#
# Achtung: `schedule` greift nur auf dem Default-Branch. Aenderungen an dieser
# Datei werden erst nach dem Merge wirksam. Vorher per `workflow_dispatch`
# von Hand ausloesen.

name: Live tests

on:
  schedule:
    # Kadenz unveraendert aus dem bisherigen Workflow uebernommen.
    - cron: "27 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # Fuer die eigene Lauf-Historie: Aus ihr kommt die Serie, die einen
  # Dauerausfall von einem kurzen Aussetzer trennt (`live_streak.py`).
  actions: read

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live-Suite gegen data.finance.admin.ch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live -v --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # gebrochener Vertrag mit der Quelle. Und ein Lauf, in dem jeder Test
      # uebersprungen wurde, sieht unter jedem Exit-Code-Check aus wie Erfolg.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_run.py live-report.xml \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}"
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      # Ein Ausfall der Quelle ist `unknown` und macht kein Issue auf — richtig
      # fuer die zwei Minuten, in denen sie mal nicht antwortet, falsch fuer die
      # Woche, in der sie weg ist. Die Serie trennt beides. Kein Zaehler wird
      # gefuehrt: Der Workflow endet genau dann mit `success`, wenn die
      # Einordnung `clear` war, also steht die Antwort in der Lauf-Historie.
      - name: Lauf-Historie holen
        id: historie
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'live.yml',
              branch: context.payload.repository.default_branch,
              per_page: 20,
            });
            require('fs').writeFileSync('live-runs.json', JSON.stringify(runs.data));

      - name: Serie einordnen
        id: streak
        run: |
          python scripts/live_streak.py live-runs.json \
            --state "${{ steps.verdict.outputs.state }}" \
            --run-id "${{ github.run_id }}"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v7
        # Ueber `env`, nicht ueber `${{ }}` im Skript: Die pytest-Ausgabe ist
        # fremder Text, der sonst in einem JavaScript-Template-Literal landet.
        # Ein Backtick oder ein `${` darin bricht das Skript oder fuehrt aus,
        # was in einer Assertion-Meldung stand.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
          LIVE_STREAK: ${{ steps.streak.outputs.streak }}
          LIVE_DAUERAUSFALL: ${{ steps.streak.outputs.dauerausfall }}
        with:
          # Der Entscheidungsbaum steht in `scripts/live_issue.cjs`, nicht hier:
          # Vier Verzweigungen, jede mit Folgen fuer einen Thread, den Menschen
          # lesen — die gehoeren nicht an die einzige Stelle, an der sie niemand
          # ausfuehren kann. `scripts/live_issue.test.mjs` faehrt alle vier,
          # angestossen von `tests/test_live_issue.py` im pytest-Gate.
          script: |
            const handler = require(`${process.env.GITHUB_WORKSPACE}/scripts/live_issue.cjs`);
            const getan = await handler({ github, context, core, env: process.env });
            core.info(`Am Issue getan: ${getan}`);

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber ein Issue hat nur der Befund erzeugt — oder der
      # Ausfall, wenn er lange genug anhielt. Was tatsaechlich geschah, steht im
      # Log («Am Issue getan: …»), nicht im Exit-Code.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        run: |
          echo "Live-Suite: ${{ steps.verdict.outputs.state }}"
          echo "${{ steps.verdict.outputs.reason }}"
          exit 1

# Geplante Live-Tests gegen data.finance.admin.ch (DRIFT-005).
#
# Die Unit-Tests laufen gegen aufgezeichnete bzw. gemockte Antworten und
# koennen deshalb nicht bemerken, wenn die Quelle ihr Format aendert. Die
# `-m live`-Tests fragen sie wirklich ab; die CI der Pull Requests schliesst
# sie per `-m "not live"` aus, und das bleibt so.
#
# Achtung: `schedule` greift nur auf dem Default-Branch. Aenderungen an dieser
# Datei werden erst nach dem Merge wirksam. Vorher per `workflow_dispatch`
# von Hand ausloesen.

name: Live tests

on:
  schedule:
    # Kadenz unveraendert aus dem bisherigen Workflow uebernommen.
    - cron: "27 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # Fuer die eigene Lauf-Historie: Aus ihr kommt die Serie, die einen
  # Dauerausfall von einem kurzen Aussetzer trennt (`live_streak.py`).
  actions: read

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live-Suite gegen data.finance.admin.ch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live -v --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # gebrochener Vertrag mit der Quelle. Und ein Lauf, in dem jeder Test
      # uebersprungen wurde, sieht unter jedem Exit-Code-Check aus wie Erfolg.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_run.py live-report.xml \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}"
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      # Ein Ausfall der Quelle ist `unknown` und macht kein Issue auf — richtig
      # fuer die zwei Minuten, in denen sie mal nicht antwortet, falsch fuer die
      # Woche, in der sie weg ist. Die Serie trennt beides. Kein Zaehler wird
      # gefuehrt: Der Workflow endet genau dann mit `success`, wenn die
      # Einordnung `clear` war, also steht die Antwort in der Lauf-Historie.
      - name: Lauf-Historie holen
        id: historie
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'live.yml',
              branch: context.payload.repository.default_branch,
              per_page: 20,
            });
            require('fs').writeFileSync('live-runs.json', JSON.stringify(runs.data));

      - name: Serie einordnen
        id: streak
        run: |
          python scripts/live_streak.py live-runs.json \
            --state "${{ steps.verdict.outputs.state }}" \
            --run-id "${{ github.run_id }}"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v7
        # Ueber `env`, nicht ueber `${{ }}` im Skript: Die pytest-Ausgabe ist
        # fremder Text, der sonst in einem JavaScript-Template-Literal landet.
        # Ein Backtick oder ein `${` darin bricht das Skript oder fuehrt aus,
        # was in einer Assertion-Meldung stand.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
          LIVE_STREAK: ${{ steps.streak.outputs.streak }}
          LIVE_DAUERAUSFALL: ${{ steps.streak.outputs.dauerausfall }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            const streak = process.env.LIVE_STREAK || '?';
            const dauerausfall = process.env.LIVE_DAUERAUSFALL === 'true';
            // Stabiles Praefix: Damit ein zweiter roter Lauf den bestehenden
            // Thread verlaengert statt einen zweiten aufzumachen. Zehn Issues
            // zur selben Sache liest niemand.
            const PREFIX = 'Live-Tests gegen data.finance.admin.ch rot';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche hat ein
            // eigenes, knappes Rate-Limit und indexiert verzoegert — ein frisch
            // geoeffnetes Issue findet sie unter Umstaenden nicht, und dann
            // legt der naechste rote Lauf ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown' && !dauerausfall) {
              // Weder oeffnen noch schliessen. Der Lauf hat nichts ueber den
              // Vertrag mit data.finance.admin.ch festgestellt, und ein Issue, das auf so
              // einen Lauf hin zugeht, behauptet einen Vergleich, den es nicht
              // gab. Sichtbar wird es ueber den roten Job.
              //
              // Hier landet seit dem 17.8.2026 auch der Ausfall der Quelle: Sind
              // ALLE Fehlschlaege Transportfehler, war die Quelle nicht erreichbar
              // — das ist kein Befund und macht keinen Thread auf. Bis er anhaelt:
              // ab dem dritten Lauf ohne Gruen faellt `dauerausfall` und es geht
              // doch ein Issue auf, siehe unten.
              core.warning(`Live-Suite nicht ausgewertet: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'unknown') {
              // Dauerausfall. Kein Vertragsbruch — aber ein Server, der seine
              // Daten seit Tagen nicht laden kann, ist kaputt, auch wenn nicht
              // er der Schuldige ist. Derselbe Thread wie beim Befund: Zwei
              // Threads zur selben toten Quelle liest niemand.
              const body = [
                `Die Live-Suite ist seit **${streak} Laeufen** nicht mehr gruen, und jeder`,
                'dieser Laeufe scheiterte am Transport: `data.finance.admin.ch` war nicht',
                'erreichbar.',
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                '**Das ist kein gebrochener Vertrag.** Kein Feld hat sich bewegt, keine',
                'Kopfzeile wurde umbenannt — die Quelle antwortet gar nicht. Ein einzelner',
                'solcher Lauf oeffnet hier nichts; drei hintereinander schon, weil ein',
                'Server, der seine Daten nicht mehr laden kann, kaputt ist, egal wer schuld',
                'daran ist.',
                '',
                'Erste Schritte: den Dump von Hand abrufen und schauen, ob die Quelle',
                'antwortet — nicht aus der Fehlermeldung schliessen. Antwortet sie wieder,',
                'schliesst der naechste gruene Lauf dieses Issue von selbst.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Weiterhin nicht erreichbar am ${heute} (${streak} Laeufe).\n\n${body}`,
                });
              } else {
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo,
                  title: `${PREFIX} — Quelle seit ${streak} Laeufen nicht erreichbar (${heute})`,
                  body, labels: [LABEL],
                });
              }
              return;
            }

            if (state === 'finding') {
              const body = [
                'Die geplante Live-Suite gegen `data.finance.admin.ch` ist rot.',
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                '**Mindestens ein Fehlschlag ist inhaltlich.** Ein reiner Ausfall der',
                'Quelle wäre `unknown` und hätte dieses Issue nicht geöffnet — hier hat',
                'also etwas über den Vertrag mit der Quelle gesprochen.',
                '',
                'Das sehen die Unit-Tests nicht: Ihre Fixtures sind aus derselben Annahme',
                'geschrieben wie der Code und können sie deshalb nicht widerlegen.',
                '',
                'Erst die Quelle abfragen, dann einordnen — nicht aus der Fehlermeldung',
                'schliessen.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Das Label anlegen, falls das Repo es noch nicht kennt: Sonst
                // scheitert `issues.create` beim allerersten roten Lauf — genau
                // dann, wenn das Issue gebraucht wird.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — und nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Die Live-Suite ist wieder gruen (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log, nicht im Exit-Code.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        run: |
          echo "Live-Suite: ${{ steps.verdict.outputs.state }}"
          echo "${{ steps.verdict.outputs.reason }}"
          exit 1

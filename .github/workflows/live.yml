name: Live tests

# The live suite hits the real EFV endpoints, so it runs on a schedule and on
# demand rather than on every push (OPS-001).
on:
  schedule:
    - cron: "27 5 * * *"   # daily, off-peak
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    # Backstop: the suite finishes in seconds when upstream answers and in about
    # a minute when it does not. Anything beyond this is a hang, not a slow run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests
        run: PYTHONPATH=src pytest tests/ -m live -v

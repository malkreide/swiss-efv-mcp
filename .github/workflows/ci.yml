name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Der naechtliche Lauf ruft diesen Workflow auf, statt die fuenf Gates ein
  # zweites Mal hinzuschreiben (`nightly.yml`). Zwei Kopien muessten sich
  # stumm einigen, und genau daran ist hier schon einmal der ruff-Pin
  # gescheitert: `ci.yml` installierte eine eigene Version, die nach dem
  # dev-Install lief und pyproject ueberstimmte, ohne dass etwas rot wurde
  # (`test_werkzeug_versionen.py`). Eine Definition, zwei Ausloeser.
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Kein eigener ruff-Install: der Pin kommt mit dem dev-Install oben mit.
      # Hier stand `pip install ruff==<version>`, das danach lief und gegen
      # pyproject gewann — ein Bump dort haette in der CI nichts bewirkt.
      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
